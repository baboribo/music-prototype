# Repo-scoped settings. No global Xcode selection or skill installation changes.
model = "gpt-6-astra"
model_reasoning_effort = "ultra"

[shell_environment_policy.set]
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"

[plugins."build-ios-apps@openai-curated-remote"]
enabled = true

# The bundled process inherited CommandLineTools and could not find simctl.
# Keep the official skills; run one project-scoped server with explicit Xcode.
[plugins."build-ios-apps@openai-curated-remote".mcp_servers.xcodebuildmcp]
enabled = false

[mcp_servers.ios_project_xcode]
command = "npx"
args = ["--offline", "-y", "xcodebuildmcp@2.7.0", "mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.ios_project_xcode.env]
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"
XCODEBUILDMCP_ENABLED_WORKFLOWS = "simulator,ui-automation,debugging"
